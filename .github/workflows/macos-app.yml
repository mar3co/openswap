name: macOS app

# Freeze OpenSwap.app on a macOS runner. Sign and notarize when repository
# secrets are present. Pull requests always freeze unsigned (do not expose
# the production certificate to PR code). Tag builds require the certificate.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/macos/**"
      - "macos/OpenSwapWidget/**"
      - ".github/workflows/macos-app.yml"

jobs:
  macos-app:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # `secrets` is not available in a step-level `if`, only in `env` and
      # `with`. Hoist the presence check here so steps can gate on it.
      HAS_SIGNING_P12: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag builds must sign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          P12: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "Tag builds need SIGNING_APPLICATION_P12_BASE64" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing material
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_P12 == 'true' }}
        env:
          SIGNING_APPLICATION_P12_BASE64: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 }}
          SIGNING_APPLICATION_P12_PASSWORD: ${{ secrets.SIGNING_APPLICATION_P12_PASSWORD }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: bash packaging/macos/ci-import-signing-keychain.sh

      - name: Freeze (sign and notarize when identity is set)
        run: bash packaging/macos/build.sh

      # build.sh exits 0 when it cannot sign, so a green run is not by itself
      # proof of a shippable app. Assert it on the one path that ships.
      - name: Tag builds must be signed, notarized, and stapled
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP=packaging/macos/dist/OpenSwap.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload OpenSwap.app
        uses: actions/upload-artifact@v4
        with:
          name: OpenSwap-app
          path: packaging/macos/dist/OpenSwap.app
          if-no-files-found: error
          retention-days: 14
