name: macOS app

# Freeze OpenSwap.app on macOS runners, once per CPU architecture. Sign and
# notarize when repository secrets are present. Pull requests always freeze
# unsigned (do not expose the production certificate to PR code). Tag builds
# require the certificate and end in a draft GitHub release carrying both
# zips, their checksums, and the rendered Homebrew cask. Publishing that draft
# is a person's call; the homebrew-tap workflow then copies the cask into the
# tap.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/macos/**"
      - "packaging/homebrew/**"
      - "macos/OpenSwapWidget/**"
      - ".github/workflows/macos-app.yml"

jobs:
  macos-app:
    # uv's Python is single-architecture, so the frozen app is too. Build each
    # arch natively; the cask serves arm64 to Apple silicon and x86_64 to
    # Intel Macs. Both runners use the same macOS image so the Xcode that
    # builds the widget matches.
    name: macos-app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # `secrets` is not available in a step-level `if`, only in `env` and
      # `with`. Hoist the presence check here so steps can gate on it.
      HAS_SIGNING_P12: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 != '' }}
      OPENSWAP_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Runner is ${{ matrix.arch }}
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          if [ "$(uname -m)" != "$OPENSWAP_ARCH" ]; then
            echo "runner $RUNNER_LABEL is $(uname -m), expected $OPENSWAP_ARCH" >&2
            exit 1
          fi

      - name: Tag builds must sign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          P12: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "Tag builds need SIGNING_APPLICATION_P12_BASE64" >&2
            exit 1
          fi

      # pyproject.toml is the one place the version is written; the tag must
      # agree with it or the cask URL and the app's own version drift apart.
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version} (expected v${version})" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install xcodegen
        run: brew install xcodegen

      # Render with dummy checksums; this checks the template, not a release.
      # One leg is enough: the template does not depend on the runner.
      - name: Lint Homebrew cask
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p "$RUNNER_TEMP/Casks"
          bash packaging/homebrew/render-cask.sh 0.0.0 \
            "$(printf 'a%.0s' $(seq 64))" "$(printf 'b%.0s' $(seq 64))" \
            > "$RUNNER_TEMP/Casks/openswap.rb"
          brew style "$RUNNER_TEMP/Casks/openswap.rb"

      - name: Import signing material
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_P12 == 'true' }}
        env:
          SIGNING_APPLICATION_P12_BASE64: ${{ secrets.SIGNING_APPLICATION_P12_BASE64 }}
          SIGNING_APPLICATION_P12_PASSWORD: ${{ secrets.SIGNING_APPLICATION_P12_PASSWORD }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: bash packaging/macos/ci-import-signing-keychain.sh

      # build.sh freezes for OPENSWAP_ARCH and fails if any Mach-O in the
      # bundle does not run on it.
      - name: Freeze (sign and notarize when identity is set)
        env:
          OPENSWAP_BUILD_NUMBER: ${{ github.run_number }}
        run: bash packaging/macos/build.sh

      # Every build, signed or not: the zip that would ship unpacks to an app
      # whose executable is built for this arch and starts on it.
      - name: Unpacked zip runs on ${{ matrix.arch }}
        run: |
          version="$(awk -F'"' '/^version = /{print $2; exit}' pyproject.toml)"
          ZIP="packaging/macos/dist/OpenSwap-${version}-${OPENSWAP_ARCH}.zip"
          CHECK="$RUNNER_TEMP/zip-run"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          ditto -x -k "$ZIP" "$CHECK"
          EXE="$CHECK/OpenSwap.app/Contents/MacOS/OpenSwap"
          lipo -archs "$EXE"
          lipo -archs "$EXE" | grep -qw "$OPENSWAP_ARCH"
          "$EXE" --version

      # build.sh exits 0 when it cannot sign, so a green run is not by itself
      # proof of a shippable app. Assert it on the one path that ships, against
      # the zip that ships: unpack it the way a download would be and assess
      # that copy rather than the build folder.
      - name: Tag builds must be signed, notarized, and stapled
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ZIP="packaging/macos/dist/OpenSwap-${GITHUB_REF_NAME#v}-${OPENSWAP_ARCH}.zip"
          CHECK="$RUNNER_TEMP/zip-check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          ditto -x -k "$ZIP" "$CHECK"
          APP="$CHECK/OpenSwap.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          "$APP/Contents/MacOS/OpenSwap" --version

      # The zip, not the .app folder: upload-artifact drops execute bits and
      # symlinks, which leaves a bundle that neither launches nor verifies.
      - name: Upload OpenSwap zip
        uses: actions/upload-artifact@v4
        with:
          name: OpenSwap-app-${{ matrix.arch }}
          path: |
            packaging/macos/dist/OpenSwap-*-${{ matrix.arch }}.zip
            packaging/macos/dist/OpenSwap-*-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    # `needs` waits for every matrix leg, so a release is drafted only when
    # both architectures built, signed, and passed the assessment above.
    needs: macos-app
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: OpenSwap-app-*
          merge-multiple: true
          path: dist

      - name: Verify checksums and render cask
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 x86_64; do
            (cd dist && sha256sum -c "OpenSwap-${version}-${arch}.zip.sha256")
          done
          arm64="$(cut -d' ' -f1 < "dist/OpenSwap-${version}-arm64.zip.sha256")"
          x86_64="$(cut -d' ' -f1 < "dist/OpenSwap-${version}-x86_64.zip.sha256")"
          bash packaging/homebrew/render-cask.sh "$version" "$arm64" "$x86_64" > dist/openswap.rb
          cat dist/openswap.rb

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "OpenSwap ${version}" --generate-notes \
            "dist/OpenSwap-${version}-arm64.zip" \
            "dist/OpenSwap-${version}-arm64.zip.sha256" \
            "dist/OpenSwap-${version}-x86_64.zip" \
            "dist/OpenSwap-${version}-x86_64.zip.sha256" \
            dist/openswap.rb
