[project]
name = "openswap"
version = "0.1.0"
description = "OpenSoft menu bar app for rotating AI coding accounts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Windows-only: needed solely by the one-time keyring -> files migration
    # (migrations.py) for users upgrading from <=0.10.x. macOS/Linux never
    # import it on the hot path; the macOS migration has a security-CLI
    # fallback and the legacy purge sweep no-ops when it's absent.
    "keyring>=25.0.0; sys_platform == 'win32'",
    "truststore>=0.10.4",
]
authors = [{name = "OpenSoft"}]
license = {text = "MIT"}
keywords = ["openswap", "claude-code", "account-switcher", "menubar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4.0"]

[project.urls]
Homepage = "https://github.com/mar3co/openswap"
Repository = "https://github.com/mar3co/openswap"
Issues = "https://github.com/mar3co/openswap/issues"

[project.scripts]
openswap = "openswap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openswap"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel by default. The suite is mostly idle work (file locks, subprocess
# fakes), so wall clock was dominated by doing them one at a time. `auto`
# rather than a fixed number so CI runners (2-4 cores) and this box both get
# the cores they have.
addopts = "-n auto --dist loadgroup"
markers = [
    "no_keychain_fake: opt out of the autouse in-memory Keychain guard (test mocks subprocess itself, or runs against a temp keychain on GitHub Actions)",
    "no_oauth_profile_fake: opt out of the autouse fetch_oauth_profile stub (test exercises fetch_oauth_profile itself against a mocked urlopen)",
]
